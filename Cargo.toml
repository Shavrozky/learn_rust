[package]
name = "learn-rust"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
    "frontend"
]

[dependencies]
axum = { version = "0.7", features = ["multipart", "ws"] }
tokio = { version = "1.0", features = ["full"] }
redb = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
utoipa = "5.3"
utoipa-swagger-ui = { version = "8.1", features = ["axum"] }
tower-http = { version = "0.5", features = ["cors"] }
web-sys = { version = "0.3", features = ["HtmlInputElement", "FileList", "File", "FormData"] }
reqwest = { version = "0.13.4", features = ["multipart", "json"] }
